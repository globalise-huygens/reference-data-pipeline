type: Ship
catalog: https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/ship:index/page-1.json

fields:
  id:
    - "$.id"

  identifier:
    - "$.identified_by[?(@.type=='Identifier')].content"
    - "$.is_similarity_subject_of[*].ascribes_similarity_target[*].id"
    # Follows $.moved_by[*].id -> voyage: voyage/*.json (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/voyage:index/page-1.json)
    - "$.moved_by[*].identified_by[?(@.type=='Identifier')].content"

  title:
    - "$.is_appellative_subject_of[*].ascribes_appellation[*].content"

  description: []

  related: []

facets:
  place: # + P124i_was_transformed_by etc.
    - "$.produced_by.took_place_at[*].id"
    - "$.taken_out_of_existence_by.took_place_at[*].id"
    - "$.is_ownership_subject_of[*].has_geographic_scope[*].id"
    # Follows $.moved_by[*].id -> voyage: voyage/*.json (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/voyage:index/page-1.json)
    - "$.moved_by[*].moved_from.id"
    - "$.moved_by[*].moved_to.id"

  date_begin: # + P124i_was_transformed_by + P24i_changed_ownership_through + P30i_custody_transferred_through
    - "$.produced_by.timespan.begin_of_the_begin"
    - "$.produced_by.timespan.end_of_the_begin"
    # Follows $.moved_by[*].id -> voyage: voyage/*.json (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/voyage:index/page-1.json)
    - "$.moved_by[*].timespan.begin_of_the_begin"
    - "$.moved_by[*].timespan.end_of_the_begin"

  date_end: # + P124i_was_transformed_by + P24i_changed_ownership_through + P30i_custody_transferred_through
    - "$.taken_out_of_existence_by.timespan.end_of_the_end"
    - "$.taken_out_of_existence_by.timespan.begin_of_the_end"
    - "$.produced_by.timespan.end_of_the_end"
    - "$.produced_by.timespan.begin_of_the_end"
    # Follows $.moved_by[*].id -> voyage: voyage/*.json (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/voyage:index/page-1.json)
    - "$.moved_by[*].timespan.end_of_the_end"
    - "$.moved_by[*].timespan.begin_of_the_end"

  ship_classification:
    - "$.is_classificatory_subject_of[*].ascribes_classification[*].id"

  ship_owner: # + P24i_changed_ownership_through + P30i_custody_transferred_through
    - "$.is_ownership_subject_of[*].ascribes_owner[*].id"
    - "$.is_custodial_subject_of[*].ascribes_custodian[*].id"

  ship_departure: # Follows $.moved_by[*].id -> voyage: voyage/*.json (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/voyage:index/page-1.json)
    - "$.moved_by[*].moved_from.id"

  ship_arrival: # Follows $.moved_by[*].id -> voyage: voyage/*.json (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/voyage:index/page-1.json)
    - "$.moved_by[*].moved_to.id"
