# - group/ORG_121.json (https://objectstore.surf.nl/87435b768620494e8e911c83d1997f24:globalise-data/objects/group/ORG_121.json) [Page 1]
# - group/ORG_99.json (https://objectstore.surf.nl/87435b768620494e8e911c83d1997f24:globalise-data/objects/group/ORG_99.json) [Page 1]

file: group/*.json

organization:
  index:
    # Core Identification
    id: $.id
    identifier: $.identified_by[?(@.type=='Identifier')].content
    object_type: $.type

    # Names & Appellations
    title: $.is_appellative_subject_of[*].ascribes_appellation[*].content

    # Temporal Boundaries
    start: $.created_by.timespan.begin_of_the_begin
    end: $.dissolved_by.timespan.end_of_the_end
    start_earliest: $.created_by.timespan.begin_of_the_begin
    start_latest: $.created_by.timespan.end_of_the_begin
    end_earliest: $.dissolved_by.timespan.begin_of_the_end
    end_latest: $.dissolved_by.timespan.end_of_the_end

    # Classification
    classification: $.is_classificatory_subject_of[*].ascribes_classification[*].id

    # Location
    location: $.is_residence_subject_of[*].ascribes_residence_place[*].id

  other:
    # Hierarchy & Relations
    member_of: $.is_membership_subject_of[*].ascribes_group[*].id
    membership_relation: $.is_membership_subject_of[*].ascribes_membership_relation[*].id
    relation: $.is_social_relation_subject_of[*].ascribes_social_relation_target[*].id
    social_relation_type: $.is_social_relation_subject_of[*].ascribes_social_relation[*].id

    # Concordances
    same_as: $.is_similarity_subject_of[*].ascribes_similarity_target[*].id
