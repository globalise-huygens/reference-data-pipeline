type: Place
catalog: https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/place:index/page-1.json

fields:
  id:
    - "$.id"

  identifier:
    - "$.identified_by[?(@.type=='Identifier')].content"
    - "$.is_similarity_subject_of[*].ascribes_similarity_target[*].id"

  title: # full-text, boost
    - "$.is_appellative_subject_of[*].ascribes_appellation[*].content"

  description: []

  related: # full-text
    # Follows $.is_topographical_subject_of[*].ascribes_place[*].id -> place (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/place:index/page-1.json)
    - "$.is_topographical_subject_of[?(@.ascribes_topographical_relation[*].id=='crm:P121_overlaps_with')].ascribes_place[*].is_appellative_subject_of[*].ascribes_appellation[*].content"

facets:
  place:
    - "$.is_topographical_subject_of[*].ascribes_place[*].id"

  date_begin:
    - "$.is_appellative_subject_of[*].timespan.begin_of_the_begin"
    - "$.is_appellative_subject_of[*].timespan.end_of_the_begin"
    - "$.is_topographical_subject_of[*].timespan.begin_of_the_begin"
    - "$.is_topographical_subject_of[*].timespan.end_of_the_begin"
    - "$.is_classificatory_subject_of[*].timespan.begin_of_the_begin"
    - "$.is_classificatory_subject_of[*].timespan.end_of_the_begin"

  date_end:
    - "$.is_appellative_subject_of[*].timespan.end_of_the_end"
    - "$.is_appellative_subject_of[*].timespan.begin_of_the_end"
    - "$.is_topographical_subject_of[*].timespan.end_of_the_end"
    - "$.is_topographical_subject_of[*].timespan.begin_of_the_end"
    - "$.is_classificatory_subject_of[*].timespan.end_of_the_end"
    - "$.is_classificatory_subject_of[*].timespan.begin_of_the_end"

  place_classification:
    - "$.is_classificatory_subject_of[*].ascribes_classification[*].id"

  place_hierarchy:
    - "$.is_topographical_subject_of[?(@.ascribes_topographical_relation[*].id=='crm:P89_falls_within')].ascribes_place[*].id"

  place_latitude:
    - "$.is_approximated_by_declarative_place.place_is_defined_by[?(@.classified_as[*].id=='http://vocab.getty.edu/aat/300387565')].content"

  place_longitude:
    - "$.is_approximated_by_declarative_place.place_is_defined_by[?(@.classified_as[*].id=='http://vocab.getty.edu/aat/300387567')].content"
