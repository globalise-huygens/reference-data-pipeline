type: Polity
catalog: https://id.globalise.nl/hdl:20.500.14722/polity:index/page-1.json

fields:
  id:
    - "$.id"

  label:
    - "$.is_appellative_subject_of[?(@.classified_as[*].id contains 'http://vocab.getty.edu/aat/300404670')].ascribes_appellation[*].content"

  identifier: # keyword
    - "$.identified_by[?(@.type=='Identifier')].content"
    - "$.is_similarity_subject_of[*].ascribes_similarity_target[*].id"
    # Follows $.was_subject_population_of[*].id -> rulership: dynasty/*.json & reign/*.json (https://id.globalise.nl/hdl:20.500.14722/rulership:index/page-1.json)
    - "$.was_subject_population_of[*].id|$.identified_by[?(@.type=='Identifier')].content"
    # Follows $.was_subject_population_of[*].had_sovereign[*].id -> person: person/*.json (https://id.globalise.nl/hdl:20.500.14722/person:index/page-1.json)
    - "$.was_subject_population_of[*].id|$.had_sovereign[*].id|$.identified_by[?(@.type=='Identifier')].content"

  title: # full-text, boost
    - "$.is_appellative_subject_of[*].ascribes_appellation[*].content"
    # Follows $.was_subject_population_of[*].id -> rulership: dynasty/*.json & reign/*.json (https://id.globalise.nl/hdl:20.500.14722/rulership:index/page-1.json) -> is_appellative_subject_of -> ascribes_appellation
    - "$.was_subject_population_of[*].id|$.is_appellative_subject_of[*].ascribes_appellation[*].content"

  description: []

  related: # full-text
    # Follows $.was_subject_population_of[*].had_sovereign[*].id -> person: person/*.json (https://id.globalise.nl/hdl:20.500.14722/person:index/page-1.json) -> is_appellative_subject_of -> ascribes_appellation
    - "$.was_subject_population_of[*].id|$.had_sovereign[*].id|$.is_appellative_subject_of[*].ascribes_appellation[*].content"

facets:
  place: # keyword
    - "$.is_physical_locative_subject_of[*].ascribes_place[*].id"

  date_begin: # date
    - "$.was_population_of[*].timespan.begin_of_the_begin"
    - "$.was_population_of[*].timespan.end_of_the_begin"

  date_end: # date
    - "$.was_population_of[*].timespan.end_of_the_end"
    - "$.was_population_of[*].timespan.begin_of_the_end"

  polity_polity_classification: # keyword
    - "$.is_classificatory_subject_of[*].ascribes_classification[*].id"

  polity_reign_classification: # keyword
    # Follows $.was_subject_population_of[*].id -> rulership: dynasty/*.json & reign/*.json (https://id.globalise.nl/hdl:20.500.14722/rulership:index/page-1.json)
    - "$.was_subject_population_of[*].id|$.is_classificatory_subject_of[*].ascribes_classification[*].id"

  polity_ruler: # was_subject_population_of -> had_sovereign -> person (https://id.globalise.nl/hdl:20.500.14722/person:index/page-1.json) -> is_appellative_subject_of -> ascribes_appellation
    - "$.was_subject_population_of[*].id|$.had_sovereign[*].id|$._label"

  polity_dynasty: # keyword
    # Follows $.was_subject_population_of[*].id -> rulership: dynasty/*.json (https://id.globalise.nl/hdl:20.500.14722/rulership:index/page-1.json)
    - "$.was_subject_population_of[*].id|$[?(@.classified_as[*].id contains 'http://vocab.getty.edu/aat/300386176')].id|$.is_appellative_subject_of[?(@.classified_as[*].id contains 'http://vocab.getty.edu/aat/300404670')].ascribes_appellation[*].content"
