type: Concept
catalog: https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/thesaurus:index/concept-page-1.json

fields:
  id:
    - "$.id"

  identifier:
    - "$.notation[*]"
    - "$.exactMatch[*]"
    - "$.closeMatch[*]"
    - "$.broadMatch[*]"
    - "$.narrowMatch[*]"
    - "$.relatedMatch[*]"
    - "$.source['@value']"

  title:
    - "$.prefLabel[*]['@value']"
    - "$.altLabel[*]['@value']"
    - "$.hiddenLabel[*]['@value']"

  description:
    - "$.definition[*]['@value']"
    - "$.example[*]['@value']"

  place: []

  date_begin: []

  date_end: []

  related:
    - "$.narrower..prefLabel[*]['@value']"
    - "$.narrower..altLabel[*]['@value']"
    - "$.narrower..hiddenLabel[*]['@value']"
    - "$.related[*].prefLabel[*]['@value']"
    - "$.related[*].altLabel[*]['@value']"
    - "$.related[*].hiddenLabel[*]['@value']"
