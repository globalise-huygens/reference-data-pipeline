type: Polity
catalog: https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/polity:index/page-1.json

fields:
  id:
    - "$.id"

  identifier:
    - "$.identified_by[?(@.type=='Identifier')].content"
    - "$.is_similarity_subject_of[*].ascribes_similarity_target[*].id"
    # Follows $.was_subject_population_of[*].id -> rulership: dynasty/*.json & reign/*.json (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/rulership:index/page-1.json)
    - "$.was_subject_population_of[*].identified_by[?(@.type=='Identifier')].content"
    # Follows $.was_subject_population_of[*].had_sovereign[*].id -> person: person/*.json (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/person:index/page-1.json)
    - "$.was_subject_population_of[*].had_sovereign[*].identified_by[?(@.type=='Identifier')].content"

  title: # full-text, boost
    - "$.is_appellative_subject_of[*].ascribes_appellation[*].content"
    # Follows $.was_subject_population_of[*].id -> rulership: dynasty/*.json & reign/*.json (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/rulership:index/page-1.json) -> is_appellative_subject_of -> ascribes_appellation
    - "$.was_subject_population_of[*].is_appellative_subject_of[*].ascribes_appellation[*].content"

  description: []

  related:
    # Follows $.was_subject_population_of[*].had_sovereign[*].id -> person: person/*.json (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/person:index/page-1.json) -> is_appellative_subject_of -> ascribes_appellation
    - "$.was_subject_population_of[*].had_sovereign[*].is_appellative_subject_of[*].ascribes_appellation[*].content"

facets:
  place:
    - "$.is_physical_locative_subject_of[*].ascribes_place[*].id"

  date_begin:
    - "$.was_population_of[*].timespan.begin_of_the_begin"
    - "$.was_population_of[*].timespan.end_of_the_begin"

  date_end:
    - "$.was_population_of[*].timespan.end_of_the_end"
    - "$.was_population_of[*].timespan.begin_of_the_end"

  polity_polity_classification:
    - "$.is_classificatory_subject_of[*].ascribes_classification[*].id"

  polity_reign_classification:
    # Follows $.was_subject_population_of[*].id -> rulership: dynasty/*.json & reign/*.json (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/rulership:index/page-1.json)
    - "$.was_subject_population_of[*].is_classificatory_subject_of[*].ascribes_classification[*].id"

  polity_ruler: # was_subject_population_of -> had_sovereign -> person (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/person:index/page-1.json) -> is_appellative_subject_of -> ascribes_appellation
    - "$.was_subject_population_of[*].had_sovereign[*].id

  polity_dynasty: # TODO: filter op classification = dynasty (aat:????)
    - "$.was_subject_population_of[*].id
