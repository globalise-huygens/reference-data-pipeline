type:
  - Event
  - FinancialExchange
catalog:
  - https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/occurrence:index/page-1.json
  - https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/conversion:index/page-1.json

fields:
  id:
    - "$.id"

  identifier:
    - "$.identified_by[?(@.type=='Identifier')].content"

  title: []

  description:
    - "$.referred_to_by[*].content"

  related:
    # From conversion/*.json (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/conversion:index/page-1.json)
    - "$.intentionally_initiated[*].has_exchange_value_subject[*].value"
    - "$.intentionally_initiated[*].ascribes_exchange_value_equivalent[*].value"
    - "$.intentionally_initiated[*].ascribes_exchange_value_equivalent[*].lower_value_limit"
    - "$.intentionally_initiated[*].ascribes_exchange_value_equivalent[*].upper_value_limit"

facets:
  place:
    - "$.is_event_location_subject_of[*].ascribes_place[*].id"

  date_begin:
    # From occurrence/*.json (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/occurrence:index/page-1.json)
    - "$.timespan.begin_of_the_begin"
    - "$.timespan.end_of_the_begin"
    # From conversion/*.json (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/conversion:index/page-1.json)
    - "$.timespan['crm:P82a_begin_of_the_begin']['@value']"
    - "$.timespan['crm:P81a_end_of_the_begin']['@value']"

  date_end:
    # From occurrence/*.json (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/occurrence:index/page-1.json)
    - "$.timespan.end_of_the_end"
    - "$.timespan.begin_of_the_end"
    # From conversion/*.json (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/conversion:index/page-1.json)
    - "$.timespan['crm:P82b_end_of_the_end']['@value']"
    - "$.timespan['crm:P81b_begin_of_the_end']['@value']"

  occurrence_unit:
    # From occurrence/*.json (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/occurrence:index/page-1.json)
    - "$.involved[*].id"
    # From conversion/*.json (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/conversion:index/page-1.json)
    - "$.intentionally_initiated[*].has_exchange_value_subject[*].unit.id"
    - "$.intentionally_initiated[*].ascribes_exchange_value_equivalent[*].unit.id"

  occurrence_commodity:
    # From conversion/*.json (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/conversion:index/page-1.json)
    - "$.is_dimension_of_commodity_type[*].id"
    - "$.intentionally_initiated[*].has_exchange_value_subject[*].is_dimension_of_commodity_type[*].id"
    - "$.intentionally_initiated[*].ascribes_exchange_value_equivalent[*].is_dimension_of_commodity_type[*].id"
