type: Person
catalog: https://id.globalise.nl/hdl:20.500.14722/person:index/page-1.json

fields:
  id:
    - "$.id"

  label:
    - "$_label"

  identifier: # keyword
    - "$.identified_by[?(@.type=='Identifier')].content"
    - "$.is_similarity_subject_of[*].ascribes_similarity_target[*].id"

  title: # full-text, boost
    - "$.is_appellative_subject_of[*].ascribes_appellation[*].content"

  description: []

  related: []

facets:
  place: # keyword
    # Follows -> place (https://id.globalise.nl/hdl:20.500.14722/place:index/page-1.json)
    - "$.born.took_place_at[?(@.type=='Place')].id"
    - "$.died.took_place_at[?(@.type=='Place')].id"
    - "$.is_residence_subject_of[*].ascribes_residence_place[?(@.type=='Place')].id"
    - "$.is_social_status_subject_of[*].has_geographic_scope[?(@.type=='Place')].id"
    - "$.is_classificatory_subject_of[*].has_geographic_scope[?(@.type=='Place')].id"

  date_begin: # date
    - "$.born.timespan.begin_of_the_begin"
    - "$.born.timespan.end_of_the_begin"
    - "$.is_social_status_subject_of[*].timespan.begin_of_the_begin"
    - "$.is_social_status_subject_of[*].timespan.end_of_the_begin"

  date_end: # date
    - "$.died.timespan.end_of_the_end"
    - "$.died.timespan.begin_of_the_end"
    - "$.is_social_status_subject_of[*].timespan.end_of_the_end"
    - "$.is_social_status_subject_of[*].timespan.begin_of_the_end"

  person_relation: # keyword
    - "$.is_social_relation_subject_of[*].ascribes_social_relation[*].id"

  person_identity: # keyword
    - "$.is_classificatory_subject_of[*].ascribes_classification[*].id"

  person_occupation: # keyword
    # Follows $.is_social_status_subject_of[*].ascribes_social_status[*].id -> concept (https://id.globalise.nl/hdl:20.500.14722/thesaurus:index/concept-page-1.json)
    - "$.is_social_status_subject_of[*].ascribes_social_status[?(@.inScheme[*].id contains 'https://id.globalise.nl/hdl:20.500.14722/thesaurus:225cef07-5b8e-4a8b-a141-2471a0cffce8')].id"

  person_status: # keyword
    # Follows $.is_social_status_subject_of[*].ascribes_social_status[*].id -> concept (https://id.globalise.nl/hdl:20.500.14722/thesaurus:index/concept-page-1.json)
    - "$.is_social_status_subject_of[*].ascribes_social_status[?(@.inScheme[*].id!='https://id.globalise.nl/hdl:20.500.14722/thesaurus:225cef07-5b8e-4a8b-a141-2471a0cffce8')].id"

  person_polity: # keyword
    # Follows $.is_sovereign_of[*] -> sovereign (https://id.globalise.nl/hdl:20.500.14722/sovereign:index/page-1.json) -> exercised_authority_of[*].id -> polity (https://id.globalise.nl/hdl:20.500.14722/polity:index/page-1.json)
    - "$.exercised_authority_of[*].id|$.had_subject_population[*].id|$.is_appellative_subject_of[?(@.classified_as[*].id contains 'http://vocab.getty.edu/aat/300404670')].ascribes_appellation[*].content"
