file: inventory/*.json

# Core Identification
id: $.id
identifier: $.identified_by[?(@.type=='Identifier')].content
accession_number: $.identified_by[?(@.classified_as[*].id=='http://vocab.getty.edu/aat/300312355')].content
entry_number: $.identified_by[?(@.classified_as[*].id=='http://vocab.getty.edu/aat/300445023')].content
object_type: $.type

# Titles & Labels
title: $.title[*].content

# Temporal Boundaries
start: $.produced_by.timespan.begin_of_the_begin
end: $.produced_by.timespan.end_of_the_end

# All four timespan properties for compilation interval boundaries:
start_earliest: $.produced_by.timespan.begin_of_the_begin
start_latest: $.produced_by.timespan.end_of_the_begin
end_earliest: $.produced_by.timespan.begin_of_the_end
end_latest: $.produced_by.timespan.end_of_the_end

# Production Location
location: $.produced_by.took_place_at[*].id

# Archival Series & Hierarchy
series: $.member_of[*].id

# Contained Documents
documents: $.part[*].id

# Content & Text Resource
plain_text_url: $.carries.digitally_carried_by.id
web_page_url: $.subject_of[*].digitally_carried_by[*].id

# Classification
classification: $.classified_as[*].id
