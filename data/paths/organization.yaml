type: Group
catalog: https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/group:index/page-1.json

fields:
  id:
    - "$.id"

  identifier:
    - "$.identified_by[?(@.type=='Identifier')].content"
    - "$.is_similarity_subject_of[*].ascribes_similarity_target[*].id"

  title: # full-text, boost
    - "$.is_appellative_subject_of[*].ascribes_appellation[*].content"

  description: # full-text # TODO: comment in LinguisticObject + classificatie
    - "$.referred_to_by[*].content"

  related: # TODO: Labels van relations-between-organisations
    # # Follows $.is_membership_subject_of[*].ascribes_group[*].id -> group (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/group:index/page-1.json)
    # - "$.is_membership_subject_of[*].ascribes_group[*].is_appellative_subject_of[*].ascribes_appellation[*].content"
    # # Follows $.is_social_relation_subject_of[*].ascribes_social_relation_target[*].id -> group (https://data.globalise.huygens.knaw.nl/hdl:20.500.14722/group:index/page-1.json)
    # - "$.is_social_relation_subject_of[*].ascribes_social_relation_target[*].is_appellative_subject_of[*].ascribes_appellation[*].content"

facets:
  place:
    - "$.is_intentional_subject_of[*].ascribes_place[*].id"

  date_begin:
    - "$.is_classificatory_subject_of[*].timespan.begin_of_the_begin"
    - "$.is_classificatory_subject_of[*].timespan.end_of_the_begin"
    - "$.is_intentional_subject_of[*].timespan.begin_of_the_begin"
    - "$.is_intentional_subject_of[*].timespan.end_of_the_begin"

  date_end:
    - "$.is_classificatory_subject_of[*].timespan.end_of_the_end"
    - "$.is_classificatory_subject_of[*].timespan.begin_of_the_end"
    - "$.is_intentional_subject_of[*].timespan.end_of_the_end"
    - "$.is_intentional_subject_of[*].timespan.begin_of_the_end"

  organization_classification:
    - "$.is_classificatory_subject_of[*].ascribes_classification[*].id"
